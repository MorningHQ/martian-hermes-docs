<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="430" viewBox="0 0 1050 430" role="img" aria-labelledby="title desc"><title id="title">Two backup paths</title><desc id="desc">Application archives copy Hermes home and workspace to S3, daily for 35 days and weekly or pre-upgrade for 90 days. AWS Backup snapshots the data volume, daily for 7 days and weekly for 35 days. Rehearse application restores in a separate home before touching live data.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 7 4 1 7" fill="none" stroke="#777169" stroke-width="1.3"/></marker></defs><rect width="1050" height="430" rx="12" fill="#fafafa"/><g font-family="Inter, Arial, sans-serif"><text x="28" y="38" font-size="22" fill="#0c0a09" font-weight="600">Back up files and the data disk</text><rect x="28" y="103" width="265" height="90" rx="8" fill="#fff" stroke="#d6d3d1"/><text x="48" y="135" font-size="18" fill="#0c0a09" font-weight="600">Hermes home + workspace</text><text x="48" y="161" font-size="14" fill="#4e4e4e" font-weight="500">Brief service pause for archive</text><rect x="460" y="103" width="562" height="90" rx="8" fill="#fff" stroke="#d6d3d1"/><text x="480" y="135" font-size="18" fill="#0c0a09" font-weight="600">S3 application archives</text><text x="480" y="161" font-size="14" fill="#4e4e4e" font-weight="500">Daily 35 days · weekly / pre-upgrade 90 days</text><polyline points="293,148 460,148" fill="none" stroke="#777169" stroke-width="1.6" marker-end="url(#arrow)"/><text x="315" y="126" font-size="13" fill="#4e4e4e" font-weight="500">Daily 03:15 UTC</text><rect x="28" y="242" width="265" height="90" rx="8" fill="#fff" stroke="#d6d3d1"/><text x="48" y="274" font-size="18" fill="#0c0a09" font-weight="600">Retained data volume</text><text x="48" y="300" font-size="14" fill="#4e4e4e" font-weight="500">Includes synthetic lab state</text><rect x="460" y="242" width="562" height="90" rx="8" fill="#fff" stroke="#d6d3d1"/><text x="480" y="274" font-size="18" fill="#0c0a09" font-weight="600">AWS Backup snapshots</text><text x="480" y="300" font-size="14" fill="#4e4e4e" font-weight="500">Daily 7 days · weekly 35 days</text><polyline points="293,287 460,287" fill="none" stroke="#777169" stroke-width="1.6" marker-end="url(#arrow)"/><text x="310" y="265" font-size="13" fill="#4e4e4e" font-weight="500">Separate schedule</text><text x="28" y="386" font-size="14" fill="#4e4e4e" font-weight="500">Rehearse restores in a temporary home. Rebuild tool runtimes; reauthenticate browser profiles.</text></g></svg>