<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="245" viewBox="0 0 1000 245" role="img" aria-labelledby="title desc"><title id="title">Connect to browser chat</title><desc id="desc">Your browser opens localhost port 19119. An AWS SSM tunnel carries traffic to the EC2 dashboard on loopback port 9119. Keep the tunnel terminal open.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 7 4 1 7" fill="none" stroke="#777169" stroke-width="1.3"/></marker></defs><rect width="1000" height="245" rx="12" fill="#fafafa"/><g font-family="Inter, Arial, sans-serif"><text x="28" y="38" font-size="20" fill="#0c0a09" font-weight="600">Browser access</text><rect x="28" y="90" width="245" height="92" rx="8" fill="#fff" stroke="#d6d3d1"/><text x="48" y="122" font-size="18" fill="#0c0a09" font-weight="600">Your browser</text><text x="48" y="148" font-size="14" fill="#4e4e4e" font-weight="500">127.0.0.1:19119</text><rect x="365" y="90" width="250" height="92" rx="8" fill="#fff" stroke="#d6d3d1"/><text x="385" y="122" font-size="18" fill="#0c0a09" font-weight="600">SSM tunnel</text><text x="385" y="148" font-size="14" fill="#4e4e4e" font-weight="500">Keep this terminal open</text><rect x="708" y="90" width="264" height="92" rx="8" fill="#fff" stroke="#d6d3d1"/><text x="728" y="122" font-size="18" fill="#0c0a09" font-weight="600">EC2 dashboard</text><text x="728" y="148" font-size="14" fill="#4e4e4e" font-weight="500">127.0.0.1:9119</text><polyline points="273,136 365,136" fill="none" stroke="#777169" stroke-width="1.6" marker-end="url(#arrow)"/><text x="284" y="116" font-size="13" fill="#4e4e4e" font-weight="500">AWS IAM</text><polyline points="615,136 708,136" fill="none" stroke="#777169" stroke-width="1.6" marker-end="url(#arrow)"/><text x="28" y="220" font-size="14" fill="#4e4e4e" font-weight="500">The dashboard has no public inbound port.</text></g></svg>