<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="590" viewBox="0 0 1100 590" role="img" aria-labelledby="title desc"><title id="title">How the hosted agent fits together</title><desc id="desc">Browser, terminal and messaging connect to one EC2 controller. Hermes calls a remote model and uses local CLI, browser and Martian MCP tools. Tools reach the synthetic lab or approved HTTPS adapters. Local subagents share this controller.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 7 4 1 7" fill="none" stroke="#777169" stroke-width="1.3"/></marker></defs><rect width="1100" height="590" rx="12" fill="#fafafa"/><g font-family="Inter, Arial, sans-serif"><text x="28" y="38" font-size="22" fill="#0c0a09" font-weight="600">One controller. Tools run on demand.</text><rect x="28" y="88" width="265" height="90" rx="8" fill="#fff" stroke="#d6d3d1"/><text x="48" y="120" font-size="18" fill="#0c0a09" font-weight="600">You</text><text x="48" y="146" font-size="14" fill="#4e4e4e" font-weight="500">Browser · terminal · messaging</text><rect x="347" y="78" width="440" height="440" rx="12" fill="#f5f5f5" stroke="#d6d3d1" stroke-dasharray="5 5"/><text x="370" y="110" font-size="14" fill="#4e4e4e" font-weight="500">EC2 · 2 vCPU / 4 GiB</text><rect x="376" y="140" width="382" height="80" rx="8" fill="#fff" stroke="#d6d3d1"/><text x="396" y="172" font-size="18" fill="#0c0a09" font-weight="600">Hermes</text><text x="396" y="198" font-size="14" fill="#4e4e4e" font-weight="500">Goals · sessions · native subagents</text><rect x="376" y="278" width="382" height="80" rx="8" fill="#fff" stroke="#d6d3d1"/><text x="396" y="310" font-size="18" fill="#0c0a09" font-weight="600">Tools</text><text x="396" y="336" font-size="14" fill="#4e4e4e" font-weight="500">CLI · browser MCP · Martian MCP</text><rect x="376" y="415" width="184" height="72" rx="8" fill="#fff" stroke="#d6d3d1"/><text x="396" y="447" font-size="18" fill="#0c0a09" font-weight="600">Encrypted disk</text><text x="396" y="473" font-size="14" fill="#4e4e4e" font-weight="500">Home · workspace</text><rect x="574" y="415" width="184" height="72" rx="8" fill="#fff" stroke="#d6d3d1"/><text x="594" y="447" font-size="18" fill="#0c0a09" font-weight="600">Synthetic lab</text><text x="594" y="473" font-size="14" fill="#4e4e4e" font-weight="500">Local Unix socket</text><rect x="838" y="140" width="234" height="80" rx="8" fill="#fff" stroke="#d6d3d1"/><text x="858" y="172" font-size="18" fill="#0c0a09" font-weight="600">Model provider</text><text x="858" y="198" font-size="14" fill="#4e4e4e" font-weight="500">OAuth or Bedrock IAM</text><rect x="838" y="278" width="234" height="80" rx="8" fill="#fff" stroke="#d6d3d1"/><text x="858" y="310" font-size="18" fill="#0c0a09" font-weight="600">Approved adapters</text><text x="858" y="336" font-size="14" fill="#4e4e4e" font-weight="500">Remote HTTPS targets</text><polyline points="293,133 322,133 322,180 376,180" fill="none" stroke="#777169" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="758,180 838,180" fill="none" stroke="#777169" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="566,220 566,278" fill="none" stroke="#777169" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="758,318 838,318" fill="none" stroke="#777169" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="470,358 470,415" fill="none" stroke="#777169" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="666,358 666,415" fill="none" stroke="#777169" stroke-width="1.6" marker-end="url(#arrow)"/><text x="28" y="555" font-size="14" fill="#4e4e4e" font-weight="500">Native subagents share the controller. Separate customer workers are not deployed.</text></g></svg>