<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="405" viewBox="0 0 1050 405" role="img" aria-labelledby="title desc"><title id="title">Two iMessage routes</title><desc id="desc">Photon connects your phone to a hosted relay and the EC2 gateway opens an outbound stream to that relay. BlueBubbles needs an always-on Mac, a private API route from EC2 to Mac, and a webhook route from Mac to EC2.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 7 4 1 7" fill="none" stroke="#777169" stroke-width="1.3"/></marker></defs><rect width="1050" height="405" rx="12" fill="#fafafa"/><g font-family="Inter, Arial, sans-serif"><text x="28" y="38" font-size="22" fill="#0c0a09" font-weight="600">Choose one iMessage route</text><rect x="28" y="89" width="235" height="80" rx="8" fill="#fff" stroke="#d6d3d1"/><text x="48" y="121" font-size="18" fill="#0c0a09" font-weight="600">Your iPhone</text><text x="48" y="147" font-size="14" fill="#4e4e4e" font-weight="500">Assigned Photon line</text><rect x="398" y="89" width="235" height="80" rx="8" fill="#fff" stroke="#d6d3d1"/><text x="418" y="121" font-size="18" fill="#0c0a09" font-weight="600">Photon relay</text><text x="418" y="147" font-size="14" fill="#4e4e4e" font-weight="500">Hosted by Photon</text><rect x="768" y="89" width="254" height="80" rx="8" fill="#fff" stroke="#d6d3d1"/><text x="788" y="121" font-size="18" fill="#0c0a09" font-weight="600">Hermes on EC2</text><text x="788" y="147" font-size="14" fill="#4e4e4e" font-weight="500">Opens outbound stream</text><polyline points="263,129 398,129" fill="none" stroke="#777169" stroke-width="1.6" marker-end="url(#arrow)"/><text x="294" y="111" font-size="13" fill="#4e4e4e" font-weight="500">Messages</text><polyline points="768,129 633,129" fill="none" stroke="#777169" stroke-width="1.6" marker-end="url(#arrow)"/><text x="662" y="111" font-size="13" fill="#4e4e4e" font-weight="500">Connection</text><rect x="28" y="246" width="235" height="80" rx="8" fill="#fff" stroke="#d6d3d1"/><text x="48" y="278" font-size="18" fill="#0c0a09" font-weight="600">Your iPhone</text><text x="48" y="304" font-size="14" fill="#4e4e4e" font-weight="500">Your Apple account</text><rect x="398" y="246" width="235" height="80" rx="8" fill="#fff" stroke="#d6d3d1"/><text x="418" y="278" font-size="18" fill="#0c0a09" font-weight="600">Always-on Mac</text><text x="418" y="304" font-size="14" fill="#4e4e4e" font-weight="500">BlueBubbles Server</text><rect x="768" y="246" width="254" height="80" rx="8" fill="#fff" stroke="#d6d3d1"/><text x="788" y="278" font-size="18" fill="#0c0a09" font-weight="600">Hermes on EC2</text><text x="788" y="304" font-size="14" fill="#4e4e4e" font-weight="500">Private network required</text><polyline points="263,286 398,286" fill="none" stroke="#777169" stroke-width="1.6" marker-end="url(#arrow)"/><text x="296" y="268" font-size="13" fill="#4e4e4e" font-weight="500">iMessage</text><polyline points="768,271 633,271" fill="none" stroke="#777169" stroke-width="1.6" marker-end="url(#arrow)"/><text x="662" y="252" font-size="13" fill="#4e4e4e" font-weight="500">API → Mac</text><polyline points="633,306 768,306" fill="none" stroke="#777169" stroke-width="1.6" marker-end="url(#arrow)"/><text x="645" y="343" font-size="13" fill="#4e4e4e" font-weight="500">Webhook → EC2</text><text x="28" y="378" font-size="14" fill="#4e4e4e" font-weight="500">BlueBubbles networking is an operator setup step; the browser tunnel does not provide it.</text></g></svg>