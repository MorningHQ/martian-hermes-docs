<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360" role="img" aria-labelledby="title desc"><title id="title">From recipe to report</title><desc id="desc">Choose a recipe, start a target session, seed the allowed fixture, send a turn, then verify the effect and save the report. The synthetic lab validates canary or ledger effects rather than accepting the model claim.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 7 4 1 7" fill="none" stroke="#777169" stroke-width="1.3"/></marker></defs><rect width="1100" height="360" rx="12" fill="#fafafa"/><g font-family="Inter, Arial, sans-serif"><text x="28" y="38" font-size="22" fill="#0c0a09" font-weight="600">A test needs an observed result</text><rect x="28" y="95" width="185" height="88" rx="8" fill="#fff" stroke="#d6d3d1"/><text x="48" y="127" font-size="18" fill="#0c0a09" font-weight="600">1. Choose</text><text x="48" y="153" font-size="14" fill="#4e4e4e" font-weight="500">Recipe + target</text><rect x="245" y="95" width="185" height="88" rx="8" fill="#fff" stroke="#d6d3d1"/><text x="265" y="127" font-size="18" fill="#0c0a09" font-weight="600">2. Prepare</text><text x="265" y="153" font-size="14" fill="#4e4e4e" font-weight="500">Session + fixture</text><rect x="462" y="95" width="175" height="88" rx="8" fill="#fff" stroke="#d6d3d1"/><text x="482" y="127" font-size="18" fill="#0c0a09" font-weight="600">3. Send</text><text x="482" y="153" font-size="14" fill="#4e4e4e" font-weight="500">Target turn</text><rect x="669" y="95" width="185" height="88" rx="8" fill="#fff" stroke="#d6d3d1"/><text x="689" y="127" font-size="18" fill="#0c0a09" font-weight="600">4. Verify</text><text x="689" y="153" font-size="14" fill="#4e4e4e" font-weight="500">Canary / state</text><rect x="886" y="95" width="186" height="88" rx="8" fill="#fff" stroke="#d6d3d1"/><text x="906" y="127" font-size="18" fill="#0c0a09" font-weight="600">5. Save</text><text x="906" y="153" font-size="14" fill="#4e4e4e" font-weight="500">Evidence + report</text><polyline points="213,139 245,139" fill="none" stroke="#777169" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="430,139 462,139" fill="none" stroke="#777169" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="637,139 669,139" fill="none" stroke="#777169" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="854,139 886,139" fill="none" stroke="#777169" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="462" y="238" width="610" height="75" rx="8" fill="#f5f5f5" stroke="#d6d3d1"/><text x="482" y="270" font-size="18" fill="#0c0a09" font-weight="600">Supported lab effect → synthetic-confirmed</text><text x="482" y="296" font-size="14" fill="#4e4e4e" font-weight="500">No supporting effect → unconfirmed</text><polyline points="762,183 762,238" fill="none" stroke="#777169" stroke-width="1.6" marker-end="url(#arrow)"/><text x="28" y="255" font-size="15" fill="#4e4e4e" font-weight="500">Repeat in a fresh session</text><text x="28" y="281" font-size="15" fill="#4e4e4e" font-weight="500">for each target.</text></g></svg>